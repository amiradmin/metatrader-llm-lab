services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metatrader-llm-lab-bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
