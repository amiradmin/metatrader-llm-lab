[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "metatrader-llm-lab"
version = "0.1.0"
description = "Hands-on MetaTrader 5 + LLM learning lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.0",
  "torch>=2.7.0",
  "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metatrader_llm_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
